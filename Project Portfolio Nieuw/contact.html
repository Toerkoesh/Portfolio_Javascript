<!DOCTYPE html>
<html lang="nl">

    <main>
        <section class="page-title">
            <h1>Contact</h1>
            <p>Wil je contact met mij opnemen? Vul dan het formulier hieronder in.</p>
        </section>

        <section class="content-box">
            <form>
                <label for="naam">Naam</label>
                <input type="text" id="naam" name="naam" placeholder="Vul je naam in">

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Vul je e-mail in">

                <label for="bericht">Bericht</label>
                <textarea id="bericht" name="bericht" placeholder="Schrijf hier je bericht..."></textarea>

                <button type="submit">Versturen</button>
            </form>
        </section>
    </main>

    <footer>
    <a href="contact.html">Contact</a>
